task deployToStage{
    doLast {
        println "Deployed to Stage"
    }

}


task deployToProd{
    doLast {
        println "Deployed to Prod"
    }

}

task cleanUpFiles{
    doLast {
        println "Cleaned Up files"
    }
}

deployToProd.dependsOn deployToStage
